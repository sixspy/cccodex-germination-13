name: germination-protocol-germination-13

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3423:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8423:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/germination
      JWT_SECRET: germination-protocol-dev-secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: germination
    ports:
      - "54623:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d germination"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
